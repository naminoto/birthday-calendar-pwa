# 準備用テンプレート。現リポジトリの.githubへは置かない。
# 承認後、専用Organizationの別リポジトリだけで使用する。
name: Yoribi isolated iPhone preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload:
    # repository variableに承認済みOrganization名を設定するまで動作しない。
    if: ${{ vars.YORIBI_PREVIEW_OWNER != '' && github.repository_owner == vars.YORIBI_PREVIEW_OWNER && github.repository_owner != 'naminoto' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
